<!DOCTYPE html>
<html>
<head>
  <title>Round 2 – Predict The Output</title>
  <style>
    /* ================= RESET & BASE ================= */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', 'Arial', sans-serif;
      background: #000;
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }
    
    /* Techy background with gradients */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 20% 30%, rgba(255, 0, 0, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(0, 0, 255, 0.15) 0%, transparent 50%),
        linear-gradient(to bottom, #000000, #0a0a0a);
      z-index: -2;
    }
    
    /* Animated grid lines */
    body::after {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(255, 0, 0, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 0, 255, 0.05) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: -1;
      animation: gridMove 20s linear infinite;
    }
    
    @keyframes gridMove {
      0% { transform: translateY(0) translateX(0); }
      100% { transform: translateY(40px) translateX(40px); }
    }
    
    /* ================= MAIN CONTAINER ================= */
    .box {
      max-width: 900px;
      margin: 30px auto;
      background: rgba(10, 10, 10, 0.85);
      padding: 30px;
      border-radius: 15px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow: 
        0 0 40px rgba(255, 0, 0, 0.15),
        0 0 20px rgba(0, 0, 255, 0.1),
        inset 0 0 20px rgba(0, 0, 0, 0.5);
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(5px);
    }
    
    /* Glowing border effect */
    .box::before {
      content: '';
      position: absolute;
      top: -2px;
      left: -2px;
      right: -2px;
      bottom: -2px;
      background: linear-gradient(45deg, #ff0000, #0000ff, #ff0000);
      border-radius: 17px;
      z-index: -1;
      opacity: 0.3;
      animation: borderGlow 4s ease-in-out infinite alternate;
    }
    
    @keyframes borderGlow {
      0% { opacity: 0.2; filter: blur(5px); }
      100% { opacity: 0.4; filter: blur(10px); }
    }
    
    /* ================= HEADER ================= */
    h2 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 2.2rem;
      background: linear-gradient(90deg, #ff0000, #0080ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 15px rgba(255, 0, 0, 0.3);
      letter-spacing: 1px;
      position: relative;
      padding-bottom: 15px;
    }
    
    h2::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 30%;
      width: 40%;
      height: 3px;
      background: linear-gradient(90deg, transparent, #ff0000, #0080ff, transparent);
    }
    
    /* ================= TIMER ================= */
    #timer {
      text-align: center;
      font-size: 2.5rem;
      font-weight: bold;
      margin: 20px 0 30px;
      padding: 15px;
      background: linear-gradient(135deg, #ff0000, #0000ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 20px rgba(255, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      display: inline-block;
      position: relative;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Courier New', monospace;
      letter-spacing: 3px;
      min-width: 200px;
    }
    
    #timer::before {
      content: 'TIME REMAINING';
      position: absolute;
      top: -25px;
      left: 0;
      width: 100%;
      font-size: 0.9rem;
      color: #aaa;
      letter-spacing: 3px;
      text-align: center;
      text-transform: uppercase;
    }
    
    /* ================= QUESTIONS CONTAINER ================= */
    #questions > div {
      background: rgba(20, 20, 30, 0.7);
      padding: 25px;
      margin-bottom: 25px;
      border-radius: 12px;
      border-left: 5px solid #ff0000;
      transition: all 0.3s ease;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      position: relative;
      overflow: hidden;
    }
    
    #questions > div:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 25px rgba(255, 0, 0, 0.2);
      border-left-color: #0080ff;
    }
    
    #questions > div::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 0, 0, 0.05), transparent);
      z-index: 0;
      opacity: 0;
      transition: opacity 0.3s;
    }
    
    #questions > div:hover::before {
      opacity: 1;
    }
    
    /* ================= QUESTION HEADERS ================= */
    h3 {
      font-size: 1.5rem;
      margin-bottom: 15px;
      color: #fff;
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    h3::before {
      content: '🔐';
      font-size: 1.2rem;
    }
    
    /* ================= CODE BLOCKS ================= */
    pre {
      background: rgba(6, 24, 38, 0.9);
      padding: 20px;
      border-radius: 10px;
      color: #00ffcc;
      user-select: none;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 1.1rem;
      line-height: 1.5;
      border: 1px solid rgba(0, 255, 204, 0.1);
      box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.5);
      margin: 15px 0;
      overflow-x: auto;
      position: relative;
      z-index: 1;
    }
    
    pre::before {
      content: 'Code:';
      position: absolute;
      top: -10px;
      left: 15px;
      background: rgba(6, 24, 38, 0.9);
      padding: 0 10px;
      font-size: 0.9rem;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    /* ================= INPUT FIELDS ================= */
    input {
      padding: 12px 15px;
      margin-top: 15px;
      width: 250px;
      background: rgba(30, 30, 40, 0.8);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: white;
      font-size: 1rem;
      transition: all 0.3s ease;
      font-family: 'Segoe UI', sans-serif;
      position: relative;
      z-index: 1;
    }
    
    input:focus {
      outline: none;
      border-color: #ff0000;
      box-shadow: 0 0 15px rgba(255, 0, 0, 0.3);
      background: rgba(40, 40, 50, 0.9);
    }
    
    /* Label for input */
    #questions > div > input::before {
      content: 'Your Answer:';
      display: block;
      margin-bottom: 8px;
      color: #aaa;
      font-size: 0.9rem;
    }
    
    /* ================= HORIZONTAL RULE ================= */
    hr {
      border: none;
      height: 1px;
      background: linear-gradient(90deg, transparent, #ff0000, #0080ff, transparent);
      margin: 25px 0;
      opacity: 0.3;
    }
    
    /* ================= BUTTON ================= */
    button {
      display: block;
      margin: 40px auto 20px;
      padding: 16px 45px;
      font-size: 1.2rem;
      font-weight: bold;
      background: linear-gradient(45deg, #ff0000, #0000ff);
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 2px;
      box-shadow: 0 5px 20px rgba(255, 0, 0, 0.3);
      position: relative;
      overflow: hidden;
    }
    
    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 30px rgba(255, 0, 0, 0.5);
      letter-spacing: 3px;
    }
    
    button:active {
      transform: translateY(1px);
    }
    
    button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.7s;
    }
    
    button:hover::before {
      left: 100%;
    }
    
    /* ================= TECH CORNER DECORATIONS ================= */
    .tech-corner {
      position: fixed;
      width: 80px;
      height: 80px;
      pointer-events: none;
      z-index: 1;
    }
    
    .tech-corner.tl {
      top: 20px;
      left: 20px;
      border-top: 2px solid #ff0000;
      border-left: 2px solid #ff0000;
    }
    
    .tech-corner.tr {
      top: 20px;
      right: 20px;
      border-top: 2px solid #0000ff;
      border-right: 2px solid #0000ff;
    }
    
    .tech-corner.bl {
      bottom: 20px;
      left: 20px;
      border-bottom: 2px solid #ff0000;
      border-left: 2px solid #ff0000;
    }
    
    .tech-corner.br {
      bottom: 20px;
      right: 20px;
      border-bottom: 2px solid #0000ff;
      border-right: 2px solid #0000ff;
    }
    
    /* ================= SCROLLBAR ================= */
    ::-webkit-scrollbar {
      width: 10px;
    }
    
    ::-webkit-scrollbar-track {
      background: rgba(20, 20, 30, 0.8);
      border-radius: 5px;
    }
    
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(to bottom, #ff0000, #0000ff);
      border-radius: 5px;
    }
    
    /* ================= RESPONSIVE ================= */
    @media (max-width: 950px) {
      .box {
        margin: 15px;
        padding: 20px;
      }
      
      h2 {
        font-size: 1.8rem;
      }
      
      #timer {
        font-size: 2rem;
      }
      
      pre {
        font-size: 1rem;
      }
    }
    
    @media (max-width: 600px) {
      h2 {
        font-size: 1.5rem;
      }
      
      #timer {
        font-size: 1.8rem;
        padding: 10px;
        min-width: 150px;
      }
      
      input {
        width: 100%;
      }
      
      button {
        padding: 14px 30px;
        font-size: 1.1rem;
      }
    }
    
    /* ================= ANIMATIONS ================= */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    #questions > div {
      animation: fadeIn 0.5s ease-out forwards;
      opacity: 0;
    }
    
    #questions > div:nth-child(1) { animation-delay: 0.1s; }
    #questions > div:nth-child(2) { animation-delay: 0.2s; }
    #questions > div:nth-child(3) { animation-delay: 0.3s; }
    #questions > div:nth-child(4) { animation-delay: 0.4s; }
  </style>
</head>

<body>
  <!-- Tech corner decorations -->
  <div class="tech-corner tl"></div>
  <div class="tech-corner tr"></div>
  <div class="tech-corner bl"></div>
  <div class="tech-corner br"></div>

  <div class="box">
    <h2>🔐 Round 2: Predict The Output</h2>
    <p id="timer">20:00</p>

    <div id="questions"></div>

    <button onclick="finish()">Continue</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script>
    /* ================= SUPABASE ================= */
    const supabaseClient = supabase.createClient(
      "https://vjkgawgkbehsqqtqwgic.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZqa2dhd2drYmVoc3FxdHF3Z2ljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg0NTI2NDEsImV4cCI6MjA4NDAyODY0MX0.D8rXN-7kn6UFwg6z03Pk_8XlO-G-iVbZwBw1Nx6sa-w"
    );

    let userId = null;
    let userEmail = null;

    async function getUser() {
      const { data: { user } } = await supabaseClient.auth.getUser();
      if (!user) window.location.href = "/";
      userId = user.id;
      userEmail = user.email;
    }

    /* ================= ROUND 2 QUESTIONS ================= */
    const QUESTIONS = [
      {
        type: "output",
        code: `x = 1
y = 2
for i in range(3):
    x = x + y
    y = y + 1
print(x)`,
        answer: "10",
        marks: 10
      },
      {
        type: "output",
        code: `a = 10
b = 0
while a > 0:
    if a % 3 == 0:
        b = b + a
    a = a - 1
print(b)`,
        answer: "18",
        marks: 10
      },
      {
        type: "fill",
        code: `n = 5
sum = 0
for i in range(1, ___):
    sum = sum + i
print(sum)`,
        answer: "n+1",
        marks: 10
      },
      {
        type: "fill",
        code: `x = 7
if x % ___ == 0:
    print("Even")
else:
    print("Odd")`,
        answer: "2",
        marks: 10
      }
    ];

    const answers = Array(QUESTIONS.length).fill("");

    /* ================= RENDER ================= */
    const container = document.getElementById("questions");

    QUESTIONS.forEach((q, i) => {
      container.innerHTML += `
        <div>
          <h3>Question ${i + 1}</h3>
          <pre>${q.code}</pre>
          <span style="color: #aaa; font-size: 0.9rem; display: block; margin: 10px 0 5px;">Your Answer:</span>
          <input 
            type="text"
            oninput="answers[${i}] = this.value.trim()"
            placeholder="Enter your answer...">
          <hr>
        </div>
      `;
    });

    /* ================= TIMER ================= */
    let time = 20 * 60;
    const timer = setInterval(() => {
      const m = Math.floor(time / 60);
      const s = time % 60;
      document.getElementById("timer").innerText =
        `${m}:${s < 10 ? "0" + s : s}`;
      time--;
      if (time < 0) finish();
    }, 1000);

    /* ================= FINISH ================= */
    async function finish() {
      clearInterval(timer);

      let score = 0;
      QUESTIONS.forEach((q, i) => {
        if (answers[i] === q.answer) {
          score += q.marks;
        }
      });

      console.log("Round 2 Score:", score);

      // Save score to Supabase
      const { error } = await supabaseClient
        .from("round2_scores")
        .upsert({
          user_id: userId,
          email: userEmail,
          score: score,
          submitted_at: new Date().toISOString()
        });

      if (error) {
        console.error("Error saving score:", error);
      }

      // Redirect to next stage
      window.location.href = "/stage3";
    }

    /* ================= INIT ================= */
    getUser();
  </script>
</body>
</html>
