<!DOCTYPE html>
<html>
<head>
  <title>Round 2 – Code Escape Room</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      background: #000;
      color: #fff;
      font-family: Consolas, monospace;
    }
    .box {
      max-width: 900px;
      margin: 30px auto;
      background: #0b0b14;
      padding: 25px;
      border-radius: 10px;
      border: 1px solid #222;
    }
    h2 {
      text-align: center;
      color: #00ffd5;
    }
    pre {
      background: #111;
      padding: 12px;
      border-radius: 6px;
      color: #00ff88;
    }
    .q {
      margin-bottom: 25px;
      padding: 15px;
      background: #121226;
      border-left: 4px solid #ff004c;
      border-radius: 6px;
    }
    label {
      display: block;
      margin: 6px 0;
      cursor: pointer;
    }
    button {
      background: #ff004c;
      border: none;
      padding: 12px 25px;
      font-size: 16px;
      color: white;
      cursor: pointer;
      border-radius: 6px;
    }
    #timer {
      text-align: center;
      font-size: 26px;
      margin-bottom: 20px;
      color: #ffd000;
    }
    .lock {
      text-align: center;
      font-size: 22px;
      color: #ff4444;
    }
  </style>
</head>

<body>

<div class="box">
  <h2>🔐 ROUND 2 – CODE ESCAPE ROOM</h2>
  <p id="timer">10:00</p>

  <div id="quiz"></div>

  <button onclick="submitRound2()">UNLOCK SYSTEM</button>
</div>

<script>
/* ================= SUPABASE ================= */
const supabaseClient = supabase.createClient(
  "https://vjkgawgkbehsqqtqwgic.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZqa2dhd2drYmVoc3FxdHF3Z2ljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg0NTI2NDEsImV4cCI6MjA4NDAyODY0MX0.D8rXN-7kn6UFwg6z03Pk_8XlO-G-iVbZwBw1Nx6sa-w"
);

/* ================= AUTH ================= */
let userEmail = null;

async function getUser() {
  const { data: { user } } = await supabaseClient.auth.getUser();
  if (!user) {
    alert("Login required");
    window.location.href = "/";
    return;
  }
  userEmail = user.email;
}
getUser();

/* ================= QUESTIONS ================= */
const ROUND2 = [
  {
    q: "Predict the output:",
    code: `int x = 5;
printf("%d %d %d", x++, ++x, x);`,
    o: ["5 7 7", "5 6 7", "Undefined Behavior", "6 7 7"],
    a: 2,
    digit: "3"
  },
  {
    q: "What is the bug in this code?",
    code: `int arr[5];
for(int i=0;i<=5;i++){
  arr[i] = i;
}`,
    o: ["Loop condition wrong", "Array size wrong", "Syntax error", "No issue"],
    a: 0,
    digit: "7"
  },
  {
    q: "Fill in the blank:",
    code: `for(int i=0;i<n;i++){
  _____("%d ", arr[i]);
}`,
    o: ["scanf", "printf", "cout", "print"],
    a: 1,
    digit: "1"
  },
  {
    q: "If input size doubles in O(n):",
    o: ["2×", "4×", "log n", "n²"],
    a: 0,
    digit: "9"
  }
];

const answers = Array(ROUND2.length).fill(-1);

/* ================= RENDER ================= */
const quiz = document.getElementById("quiz");

ROUND2.forEach((q, i) => {
  const div = document.createElement("div");
  div.className = "q";
  div.innerHTML = `<b>Q${i+1}. ${q.q}</b>`;
  if (q.code) div.innerHTML += `<pre>${q.code}</pre>`;

  q.o.forEach((opt, j) => {
    div.innerHTML += `
      <label>
        <input type="radio" name="q${i}" value="${j}">
        ${opt}
      </label>
    `;
  });
  quiz.appendChild(div);
});

/* ================= CAPTURE ================= */
document.addEventListener("change", e => {
  if (e.target.type === "radio") {
    const i = Number(e.target.name.replace("q",""));
    answers[i] = Number(e.target.value);
  }
});

/* ================= TIMER ================= */
let time = 10 * 60;
const t = setInterval(() => {
  const m = Math.floor(time / 60);
  const s = time % 60;
  document.getElementById("timer").innerText =
    `${m}:${s < 10 ? "0"+s : s}`;
  time--;
  if (time < 0) submitRound2();
}, 1000);

/* ================= SUBMIT ================= */
async function submitRound2() {
  clearInterval(t);

  let escapeCode = "";
  let correct = true;

  ROUND2.forEach((q,i) => {
    if (answers[i] === q.a) {
      escapeCode += q.digit;
    } else {
      correct = false;
    }
  });

  if (!correct) {
    alert("❌ SYSTEM LOCKED!\nWrong answers detected.");
    return;
  }

  alert(`✅ ESCAPE SUCCESS!\nCODE: ${escapeCode}`);

  /* SAVE RESULT (EMAIL ONLY) */
  const { error } = await supabaseClient
    .from("round2_results")
    .upsert({
      email: userEmail,
      escape_code: escapeCode
    });

  if (error) {
    alert("Error saving result");
    console.error(error);
    return;
  }

  window.location.href = "/dashboard";
}
</script>

</body>
</html>
