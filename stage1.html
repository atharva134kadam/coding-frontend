<!DOCTYPE html>
<html>
<head>
  <title>Round 1 – MCQs</title>
  <style>
    body { font-family: Arial; background:#222; color:#fff; }
    .box { max-width:900px; margin:auto; background:#333; padding:20px; }
    .q { background:#444; padding:10px; margin-bottom:10px; }
    button { padding:10px 20px; font-size:16px; }
  </style>
</head>

<body>

<div class="box">
  <h2>Round 1 – MCQs</h2>
  <p id="timer">15:00</p>

  <div id="quiz"></div>

  <button id="submitBtn" onclick="submitQuiz()">Submit</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ================= CONFIG ================= */

const supabaseClient = supabase.createClient(
  "https://vjkgawgkbehsqqtqwgic.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZqa2dhd2drYmVoc3FxdHF3Z2ljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg0NTI2NDEsImV4cCI6MjA4NDAyODY0MX0.D8rXN-7kn6UFwg6z03Pk_8XlO-G-iVbZwBw1Nx6sa-w"
);

let userId = null;

/* ================= AUTH ================= */

supabaseClient.auth.onAuthStateChange((event, session) => {
  if (!session) {
    window.location.href = "index.html";
    return;
  }
  userId = session.user.id;
});

/* ================= QUESTIONS (15) ================= */

const MCQS = [
  { q:"Insertion sort worst case?", o:["O(n)","O(n log n)","O(n²)","O(log n)"], a:2 },
  { q:"FIFO structure?", o:["Stack","Queue","Tree","Graph"], a:1 },
  { q:"Binary search needs?", o:["Sorted","Unsorted","Stack","Queue"], a:0 },
  { q:"BFS complexity?", o:["O(V)","O(V+E)","O(V²)","O(E log V)"], a:1 },
  { q:"Bubble sort best case?", o:["O(n²)","O(n)","O(log n)","O(n log n)"], a:1 },
  { q:"LIFO structure?", o:["Queue","Tree","Stack","Graph"], a:2 },
  { q:"Heap is?", o:["Tree","Graph","Array","Stack"], a:0 },
  { q:"DFS uses?", o:["Queue","Stack","Heap","Array"], a:1 },
  { q:"Merge sort complexity?", o:["O(n²)","O(n log n)","O(n)","O(log n)"], a:1 },
  { q:"Hash table avg search?", o:["O(1)","O(n)","O(log n)","O(n log n)"], a:0 },
  { q:"BST inorder gives?", o:["Sorted","Reverse","Random","None"], a:0 },
  { q:"Graph edges stored in?", o:["Adj list","Array","Stack","Heap"], a:0 },
  { q:"Queue removal?", o:["Front","Rear","Any","None"], a:0 },
  { q:"Recursion uses?", o:["Queue","Stack","Heap","Array"], a:1 },
  { q:"Quick sort worst?", o:["O(n)","O(n log n)","O(n²)","O(log n)"], a:2 }
];

const answers = Array(MCQS.length).fill(-1);

/* ================= RENDER ================= */

const quiz = document.getElementById("quiz");

MCQS.forEach((q, i) => {
  const div = document.createElement("div");
  div.className = "q";
  div.innerHTML = `<b>Q${i+1}. ${q.q}</b><br>`;
  q.o.forEach((opt, j) => {
    div.innerHTML += `
      <label>
        <input type="radio" name="q${i}" value="${j}">
        ${opt}
      </label><br>`;
  });
  quiz.appendChild(div);
});

/* ================= CAPTURE ================= */

document.addEventListener("change", e => {
  if (e.target.type === "radio") {
    const i = Number(e.target.name.replace("q",""));
    answers[i] = Number(e.target.value);
  }
});

/* ================= TIMER ================= */

let time = 15 * 60;
const timer = setInterval(() => {
  const m = Math.floor(time / 60);
  const s = time % 60;
  document.getElementById("timer").innerText =
    `${m}:${s < 10 ? "0"+s : s}`;
  time--;
  if (time < 0) submitQuiz();
}, 1000);

/* ================= SUBMIT ================= */

async function submitQuiz() {
  clearInterval(timer);

  let score = 0;
  MCQS.forEach((q,i) => {
    if (answers[i] === q.a) score++;
  });

  const { error } = await supabaseClient
    .from("round1_scores")
    .upsert({
      user_id: userId,
      score: score
    });

  if (error) {
    alert("Error saving score");
    console.error(error);
    return;
  }

  alert("Round 1 submitted! Score: " + score);
  window.location.href = "dashboard.html";
}
</script>

</body>
</html>
