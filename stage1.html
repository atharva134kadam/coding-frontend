<!DOCTYPE html>
<html>
<head>
  <title>Round 1 – MCQs</title>
  <style>
    body { font-family: Arial; background:#222; color:#fff; }
    .box { max-width:900px; margin:auto; background:#333; padding:20px; }
    .q { background:#444; padding:10px; margin-bottom:10px; }
    button { padding:10px 20px; font-size:16px; }
  </style>
</head>

<body>

<div class="box">
  <h2>Round 1 – MCQs</h2>
  <p id="timer">15:00</p>

  <div id="quiz"></div>

  <button id="submitBtn" onclick="submitQuiz()">Submit</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ================= CONFIG ================= */

const supabaseClient = supabase.createClient(
  "https://vjkgawgkbehsqqtqwgic.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZqa2dhd2drYmVoc3FxdHF3Z2ljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg0NTI2NDEsImV4cCI6MjA4NDAyODY0MX0.D8rXN-7kn6UFwg6z03Pk_8XlO-G-iVbZwBw1Nx6sa-w"
);

let userId = null;

/* ================= AUTH ================= */

supabaseClient.auth.onAuthStateChange((event, session) => {
  if (!session) {
    window.location.href = "index.html";
    return;
  }
  userId = session.user.id;
});

/* ================= QUESTIONS (15) ================= */

const MCQS = [
  { q:"Which loop in C is guaranteed to execute at least once?", 
    o:["nested for","do-while","while","for"], 
    a:1 },

  { q:"Which of the following correctly describes a pointer in C?", 
    o:["It stores a character","It stores a function","It stores an address","It stores a value"], 
    a:2 },

  { q:"Which header file is required for printf()?", 
    o:["math.h","stdio.h","string.h","stdlib.h"], 
    a:1 },

  { q:"Which operator is used to access the value at an address?", 
    o:["%","#","&","*"], 
    a:3 },

  { q:"Which of the following is TRUE about break statement?", 
    o:["It exits the loop or switch","It exits the program","It ends the function","It skips the current iteration"], 
    a:0 },

  { q:"Which of the following is a valid C variable name?", 
    o:["num-1","int","1num","_num"], 
    a:3 },

  { q:"Which memory is allocated by malloc()?", 
    o:["Register","Heap","Stack","Static"], 
    a:1 },

  { q:"Which operator is used for logical AND?", 
    o:["|","||","&&","&"], 
    a:2 },

  { q:"Which function is used to compare two strings in C?", 
    o:["strlen()","strcat()","strcmp()","strcpy()"], 
    a:2 },

  { q:"What does sizeof(int) return?", 
    o:["Address","Number of bytes","Number of digits","Number of bits"], 
    a:1 },

  { q:"Which of the following is a correct comment in C?", 
    o:["# comment","** comment **","// comment","<!-- comment -->"], 
    a:2 },

  { q:"What happens if an array index is accessed beyond its size?", 
    o:["Program terminates safely","Undefined behavior","Compile-time error","Runtime error always"], 
    a:1 },

  { q:"Which function is used to read a string with spaces in C?", 
    o:["puts()","scanf()","gets()","fgets()"], 
    a:3 },

  { q:"What is the default return type of main() in C?", 
    o:["float","void","char","int"], 
    a:3 },

  { q:"Which of the following is TRUE about functions in C?", 
    o:["Functions cannot be recursive","Function arguments are passed by value by default","Functions must always return a value","Functions can return multiple values directly"], 
    a:1 }
];

const answers = Array(MCQS.length).fill(-1);

/* ================= RENDER ================= */

const quiz = document.getElementById("quiz");

MCQS.forEach((q, i) => {
  const div = document.createElement("div");
  div.className = "q";
  div.innerHTML = `<b>Q${i+1}. ${q.q}</b><br>`;
  q.o.forEach((opt, j) => {
    div.innerHTML += `
      <label>
        <input type="radio" name="q${i}" value="${j}">
        ${opt}
      </label><br>`;
  });
  quiz.appendChild(div);
});

/* ================= CAPTURE ================= */

document.addEventListener("change", e => {
  if (e.target.type === "radio") {
    const i = Number(e.target.name.replace("q",""));
    answers[i] = Number(e.target.value);
  }
});

/* ================= TIMER ================= */

let time = 15 * 60;
const timer = setInterval(() => {
  const m = Math.floor(time / 60);
  const s = time % 60;
  document.getElementById("timer").innerText =
    `${m}:${s < 10 ? "0"+s : s}`;
  time--;
  if (time < 0) submitQuiz();
}, 1000);

/* ================= SUBMIT ================= */

async function submitQuiz() {
  clearInterval(timer);

  let score = 0;
  MCQS.forEach((q,i) => {
    if (answers[i] === q.a) score++;
  });

  const { error } = await supabaseClient
    .from("round1_scores")
    .upsert({
      user_id: userId,
      score: score
    });

  if (error) {
    alert("Error saving score");
    console.error(error);
    return;
  }

  alert("Round 1 submitted! Score: " + score);
  window.location.href = "dashboard.html";
}
</script>

</body>
</html>
