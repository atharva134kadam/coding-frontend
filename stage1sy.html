<!DOCTYPE html>
<html>

<head>
  <title>Round 1 – MCQs</title>
  <style>
    /* ================= RESET & BASE ================= */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', 'Arial', sans-serif;
      background: #000;
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      -webkit-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    /* Techy background with subtle grid */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(circle at 20% 50%, rgba(255, 0, 0, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(0, 0, 255, 0.1) 0%, transparent 50%),
        linear-gradient(to bottom, #000000, #0a0a0a);
      z-index: -2;
    }

    /* Animated grid lines for tech effect */
    body::after {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image:
        linear-gradient(rgba(255, 0, 0, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 0, 255, 0.05) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: -1;
      animation: gridMove 20s linear infinite;
    }

    @keyframes gridMove {
      0% {
        transform: translateY(0) translateX(0);
      }

      100% {
        transform: translateY(40px) translateX(40px);
      }
    }

    /* ================= MAIN CONTAINER ================= */
    .box {
      max-width: 900px;
      margin: 20px auto;
      background: rgba(10, 10, 10, 0.85);
      padding: 30px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow:
        0 0 40px rgba(255, 0, 0, 0.15),
        0 0 20px rgba(0, 0, 255, 0.1),
        inset 0 0 20px rgba(0, 0, 0, 0.5);
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(5px);
    }

    /* Glowing border effect */
    .box::before {
      content: '';
      position: absolute;
      top: -2px;
      left: -2px;
      right: -2px;
      bottom: -2px;
      background: linear-gradient(45deg, #ff0000, #0000ff, #ff0000);
      border-radius: 14px;
      z-index: -1;
      opacity: 0.3;
      animation: borderGlow 4s ease-in-out infinite alternate;
    }

    @keyframes borderGlow {
      0% {
        opacity: 0.2;
        filter: blur(5px);
      }

      100% {
        opacity: 0.4;
        filter: blur(10px);
      }
    }

    /* ================= HEADER & TITLE ================= */
    h2 {
      text-align: center;
      margin-bottom: 15px;
      font-size: 2.2rem;
      background: linear-gradient(90deg, #ff0000, #0080ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 15px rgba(255, 0, 0, 0.3);
      letter-spacing: 1px;
      position: relative;
      padding-bottom: 10px;
    }

    h2::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 25%;
      width: 50%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #ff0000, #0080ff, transparent);
    }

    /* ================= TIMER ================= */
    #timer {
      text-align: center;
      font-size: 2.8rem;
      font-weight: bold;
      margin: 20px 0;
      padding: 10px 20px;
      background: linear-gradient(135deg, #ff0000, #0000ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 20px rgba(255, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      display: inline-block;
      position: relative;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Courier New', monospace;
      letter-spacing: 2px;
    }

    #timer::before {
      content: 'TIME REMAINING';
      position: absolute;
      top: -20px;
      left: 0;
      width: 100%;
      font-size: 0.8rem;
      color: #aaa;
      letter-spacing: 3px;
      text-align: center;
    }

    /* ================= QUESTIONS ================= */
    .q {
      background: rgba(20, 20, 30, 0.7);
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 10px;
      border-left: 4px solid #ff0000;
      transition: all 0.3s ease;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
      position: relative;
      overflow: hidden;
    }

    .q:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(255, 0, 0, 0.2);
      border-left-color: #0080ff;
    }

    .q::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 0, 0, 0.05), transparent);
      z-index: 0;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .q:hover::before {
      opacity: 1;
    }

    .q b {
      font-size: 1.2rem;
      color: #fff;
      margin-bottom: 15px;
      display: block;
      position: relative;
      z-index: 1;
    }

    /* ================= OPTIONS ================= */
    label {
      display: block;
      padding: 12px 15px;
      margin: 8px 0;
      background: rgba(30, 30, 40, 0.6);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
      z-index: 1;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    label:hover {
      background: rgba(40, 40, 60, 0.8);
      transform: translateX(5px);
      border-left: 3px solid #ff0000;
    }

    input[type="radio"] {
      margin-right: 12px;
      transform: scale(1.3);
      accent-color: #ff0000;
      position: relative;
      z-index: 1;
    }

    /* Custom radio button effect */
    label::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 5px;
      height: 100%;
      background: linear-gradient(to bottom, #ff0000, #0000ff);
      border-radius: 6px 0 0 6px;
      opacity: 0;
      transition: opacity 0.3s;
    }

    label:hover::before {
      opacity: 1;
    }

    /* ================= SUBMIT BUTTON ================= */
    #submitBtn {
      display: block;
      margin: 30px auto 10px;
      padding: 15px 40px;
      font-size: 1.2rem;
      font-weight: bold;
      background: linear-gradient(45deg, #ff0000, #0000ff);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 5px 15px rgba(255, 0, 0, 0.3);
      position: relative;
      overflow: hidden;
    }

    #submitBtn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(255, 0, 0, 0.5);
      letter-spacing: 2px;
    }

    #submitBtn:active {
      transform: translateY(1px);
    }

    #submitBtn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.5s;
    }

    #submitBtn:hover::before {
      left: 100%;
    }

    /* ================= SCROLLBAR ================= */
    ::-webkit-scrollbar {
      width: 10px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(20, 20, 30, 0.8);
      border-radius: 5px;
    }

    ::-webkit-scrollbar-thumb {
      background: linear-gradient(to bottom, #ff0000, #0000ff);
      border-radius: 5px;
    }

    /* ================= RESPONSIVE ================= */
    @media (max-width: 950px) {
      .box {
        margin: 10px;
        padding: 20px;
      }

      h2 {
        font-size: 1.8rem;
      }

      #timer {
        font-size: 2.2rem;
      }
    }

    @media (max-width: 600px) {
      h2 {
        font-size: 1.5rem;
      }

      #timer {
        font-size: 1.8rem;
      }

      .q {
        padding: 15px;
      }

      label {
        padding: 10px;
      }
    }

    /* ================= ANIMATIONS ================= */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .q {
      animation: fadeIn 0.5s ease-out forwards;
      opacity: 0;
    }

    .q:nth-child(1) {
      animation-delay: 0.1s;
    }

    .q:nth-child(2) {
      animation-delay: 0.2s;
    }

    .q:nth-child(3) {
      animation-delay: 0.3s;
    }

    .q:nth-child(4) {
      animation-delay: 0.4s;
    }

    .q:nth-child(5) {
      animation-delay: 0.5s;
    }

    .q:nth-child(6) {
      animation-delay: 0.6s;
    }

    .q:nth-child(7) {
      animation-delay: 0.7s;
    }

    .q:nth-child(8) {
      animation-delay: 0.8s;
    }

    .q:nth-child(9) {
      animation-delay: 0.9s;
    }

    .q:nth-child(10) {
      animation-delay: 1.0s;
    }

    .q:nth-child(11) {
      animation-delay: 1.1s;
    }

    .q:nth-child(12) {
      animation-delay: 1.2s;
    }

    .q:nth-child(13) {
      animation-delay: 1.3s;
    }

    .q:nth-child(14) {
      animation-delay: 1.4s;
    }

    .q:nth-child(15) {
      animation-delay: 1.5s;
    }

    /* ================= ADDITIONAL TECH ELEMENTS ================= */
    .tech-corner {
      position: absolute;
      width: 100px;
      height: 100px;
      pointer-events: none;
    }

    .tech-corner.tl {
      top: 0;
      left: 0;
      border-top: 2px solid #ff0000;
      border-left: 2px solid #ff0000;
    }

    .tech-corner.tr {
      top: 0;
      right: 0;
      border-top: 2px solid #0000ff;
      border-right: 2px solid #0000ff;
    }

    .tech-corner.bl {
      bottom: 0;
      left: 0;
      border-bottom: 2px solid #ff0000;
      border-left: 2px solid #ff0000;
    }

    .tech-corner.br {
      bottom: 0;
      right: 0;
      border-bottom: 2px solid #0000ff;
      border-right: 2px solid #0000ff;
    }

    #blurOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      background: rgba(0, 0, 0, 0.3);
      z-index: 999999;
      display: none;
    }

    .exam-hidden {
      filter: blur(18px);
      pointer-events: none;
      user-select: none;
    }
  </style>
</head>

<body>
  <div id="blurOverlay">
    <div style="
        position:absolute;
        top:50%;
        left:50%;
        transform:translate(-50%,-50%);
        color:white;
        font-size:24px;
        font-weight:bold;
        text-align:center;">
      ⚠ Tab switching is not allowed<br>
      Please return to the exam
    </div>

  </div>

  <!-- Tech corner decorations -->
  <div class="tech-corner tl"></div>
  <div class="tech-corner tr"></div>
  <div class="tech-corner bl"></div>
  <div class="tech-corner br"></div>

  <div class="box">
    <h2>Round 1 – MCQs</h2>
    <p id="timer">15:00</p>

    <div id="quiz"></div>

    <button id="submitBtn" onclick="submitQuiz()">Submit Answers</button>
  </div>

  <!-- Keep the original JavaScript code unchanged -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    /* ================= CONFIG ================= */
    const supabaseClient = supabase.createClient(
      "https://vjkgawgkbehsqqtqwgic.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZqa2dhd2drYmVoc3FxdHF3Z2ljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg0NTI2NDEsImV4cCI6MjA4NDAyODY0MX0.D8rXN-7kn6UFwg6z03Pk_8XlO-G-iVbZwBw1Nx6sa-w"
    );

    let userId = null;
    let userEmail = null;

    /* ================= AUTH ================= */
    supabaseClient.auth.onAuthStateChange((event, session) => {
      if (!session) {
        window.location.href = "index.html";
        return;
      }
      userId = session.user.id;
      userEmail = session.user.email;
    });

    /* ================= QUESTIONS (15) ================= */
    const MCQS = [
      
  {
    q: "What is the time complexity of searching for an element in a balanced Binary Search Tree (BST)?",
    o: ["O(n)", "O(log n)", "O(n log n)", "O(1)"],
    a: 1
  },
  {
    q: "Which Python data structure is implemented as a Hash Table internally?",
    o: ["List", "Tuple", "Dictionary", "Set"],
    a: 2
  },
  {
    q: "In C++, which keyword is used to prevent a class from being inherited?",
    o: ["static", "const", "final", "private"],
    a: 2
  },
  {
    q: "What is the output in Python? print(type((10)))",
    o: ["<class 'tuple'>", "<class 'int'>", "<class 'list'>", "Error"],
    a: 1
  },
  {
    q: "Which area of memory is used for dynamic memory allocation (e.g., malloc, new)?",
    o: ["Stack", "Heap", "Data Segment", "Code Segment"],
    a: 1
  },
  {
    q: "Which sorting algorithm has a worst-case time complexity of O(n log n)?",
    o: ["Bubble Sort", "Selection Sort", "Insertion Sort", "Merge Sort"],
    a: 3
  },
  {
    q: "In C, what does the 'extern' keyword signify?",
    o: ["Local variable", "Variable defined in another file", "Constant variable", "Function pointer"],
    a: 1
  },
  {
    q: "What is the result of the Python expression: print(bool('0'))?",
    o: ["False", "True", "0", "Error"],
    a: 1
  },
  {
    q: "What is the time complexity of deleting a node from a Singly Linked List if the pointer to that node is already given?",
    o: ["O(1)", "O(n)", "O(log n)", "O(n²)"],
    a: 0
  },
  {
    q: "In C++, what is a class called that has at least one Pure Virtual Function?",
    o: ["Friend Class", "Abstract Class", "Static Class", "Derived Class"],
    a: 1
  },
  {
    q: "In Python, what is the output of: a = [1, 2]; b = a; b += [3]; print(a)?",
    o: ["[1, 2]", "[1, 2, 3]", "[3]", "Error"],
    a: 1
  },
  {
    q: "In Operating Systems, which scheduling algorithm can lead to starvation?",
    o: ["Round Robin", "FIFO", "Priority Scheduling", "Shortest Job First"],
    a: 2
  },
  {
    q: "What happens when a Dangling Pointer is dereferenced in C?",
    o: ["Compiler Error", "Logical Error", "Segmentation Fault / Undefined Behavior", "Normal Termination"],
    a: 2
  },
  {
    q: "What is the time complexity of the Build Heap operation in a Binary Heap?",
    o: ["O(n log n)", "O(n)", "O(log n)", "O(n²)"],
    a: 1
  },
  {
    q: "C Pointers: int a[3]={1,2,3}; int *p=a; printf(\"%d\", *(p++) + *(++p)); ?",
    o: ["4", "5", "Undefined Behavior", "3"],
    a: 2
  }
];

    const answers = Array(MCQS.length).fill(-1);

    /* ================= RENDER ================= */
    const quiz = document.getElementById("quiz");

    MCQS.forEach((q, i) => {
      const div = document.createElement("div");
      div.className = "q";
      div.innerHTML = `<b>Q${i + 1}. ${q.q}</b><br>`;
      q.o.forEach((opt, j) => {
        div.innerHTML += `
          <label>
            <input type="radio" name="q${i}" value="${j}">
            ${opt}
          </label><br>`;
      });
      quiz.appendChild(div);
    });

    /* ================= CAPTURE ================= */
    document.addEventListener("change", e => {
      if (e.target.type === "radio") {
        const i = Number(e.target.name.replace("q", ""));
        answers[i] = Number(e.target.value);
      }
    });

    /* ================= TIMER ================= */
    let time = 15 * 60;
    const timer = setInterval(() => {
      const m = Math.floor(time / 60);
      const s = time % 60;
      document.getElementById("timer").innerText =
        `${m}:${s < 10 ? "0" + s : s}`;
      time--;
      if (time < 0) submitQuiz();
    }, 1000);

    /* ================= SECURITY ================= */

    const overlay = document.getElementById("blurOverlay");
    const examBox = document.querySelector(".box");
    let violationCount = 0;
    const MAX_VIOLATIONS = 2;


    /* ---------- DISABLE COPY / SELECT ---------- */
    document.addEventListener("keydown", e => {
      if ((e.ctrlKey || e.metaKey) && ["c", "a", "x", "v"].includes(e.key.toLowerCase())) {
        e.preventDefault();
        alert("Copying is disabled during the exam.");
      }
    });

    /* ---------- DISABLE RIGHT CLICK ---------- */
    document.addEventListener("contextmenu", e => {
      e.preventDefault();
    });

    /* ---------- TAB SWITCH / MINIMIZE ---------- */
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        activateViolation();
      } else {
        restoreExam();
      }
    });

    /* ---------- WINDOW BLUR ---------- */
    window.addEventListener("blur", activateViolation);
    window.addEventListener("focus", restoreExam);

    /* ---------- SCREENSHOT DETECTION (BEST POSSIBLE) ---------- */
    document.addEventListener("keydown", e => {

      // Print Screen (Windows)
      if (e.key === "PrintScreen") {
        activateViolation();
      }

      // Win + Shift + S (Snipping Tool)
      if (e.shiftKey && e.metaKey && e.key.toLowerCase() === "s") {
        activateViolation();
      }

      // Mac screenshots
      if (e.metaKey && e.shiftKey && ["3", "4", "5"].includes(e.key)) {
        activateViolation();
      }

    });

    /* ---------- FUNCTIONS ---------- */
    function activateViolation() {
      violationCount++;

      overlay.style.display = "block";
      examBox.classList.add("exam-hidden");

      if (violationCount >= MAX_VIOLATIONS) {
        //alert("⚠ Multiple violations detected. You are being redirected.");

        // Optional: auto-submit before redirect
        // submitQuiz();

        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 1000);
      }
    }

    function restoreExam() {
      overlay.style.display = "none";
      examBox.classList.remove("exam-hidden");
    }

    /* ================= SUBMIT ================= */
    async function submitQuiz() {
      clearInterval(timer);

      let score = 0;
      MCQS.forEach((q, i) => {
        if (answers[i] === q.a) score++;
      });

      const { error } = await supabaseClient
        .from("round1_scores_sy")
        .upsert({
          user_id: userId,
          email: userEmail,
          score: score
        });

      if (error) {
        alert("Error saving score");
        console.error(error);
        return;
      }
      window.location.href = "waitsy.html";
    }
  </script>
</body>

</html>
